<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>登入</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<form method="post" action="/login">
  <h1>影片工作流</h1>
  <p>私人網站，請輸入密碼。</p>
  <input type="password" name="password" autocomplete="current-password" placeholder="密碼" required autofocus>
  <input type="hidden" name="next" id="next" value="/">
  <button type="submit">登入</button>
  <p class="err" id="err" hidden>密碼不對，請再試一次。</p>
</form>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('next')) document.getElementById('next').value = q.get('next');
  if (q.get('e')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
